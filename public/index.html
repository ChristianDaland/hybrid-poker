<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokerbordet (iPad)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background-color: #1b4d2e;
      color: white;
      text-align: center;
      margin: 0;
      padding: 10px 15px 70px 15px;
    }

    h1 {
      margin: 5px 0 10px 0;
      font-size: 1.8rem;
    }

    .winner-banner {
      background: linear-gradient(45deg, #ff9800, #f44336);
      color: white;
      padding: 12px 18px;
      font-size: 1.4rem;
      font-weight: bold;
      border-radius: 12px;
      margin: 0 auto 12px auto;
      max-width: 900px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(0.98); }
      100% { transform: scale(1.01); }
    }

    .main-layout {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 15px;
      max-width: 1150px;
      margin: 0 auto;
    }

    .poker-table {
      flex: 1;
      border: 8px solid #5c3a21;
      background-color: #2e7d32;
      border-radius: 60px;
      padding: 15px;
      min-height: 380px;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
    }

    .qr-box {
      background-color: rgba(0, 0, 0, 0.6);
      border: 2px solid #ffffff;
      border-radius: 16px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Større felleskort på bordet */
    .cards-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      min-height: 95px;
      margin: 10px 0;
    }

    .card {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      border-radius: 8px;
      width: 60px;
      height: 85px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.5);
      font-weight: bold;
    }
    .card.red { color: #d9534f; }
    .card.black { color: #222222; }
    .card-val { font-size: 1.4rem; line-height: 1; }
    .card-suit { font-size: 1.6rem; line-height: 1; }

    .players-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 10px;
    }

    .player-card {
      background: rgba(0,0,0,0.7);
      border: 2px solid #fff;
      border-radius: 12px;
      padding: 10px 14px;
      min-width: 140px;
    }

    .badge {
      display: inline-block;
      background: #ff5722;
      color: white;
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 10px;
      margin-top: 4px;
      font-weight: bold;
    }

    .controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: rgba(15, 35, 20, 0.95);
      padding: 10px;
      display: flex;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.5);
      z-index: 100;
    }

    button {
      padding: 10px 18px;
      font-size: 0.95rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-mode { background-color: #ffffff; color: #333; }
    .btn-action { background-color: #4caf50; color: white; }
    .btn-next { background-color: #2196f3; color: white; }
  </style>
</head>
<body>

  <h1>Pokerbordet</h1>

  <div id="winner-banner" class="winner-banner" style="display: none;"></div>

  <div class="main-layout">
    <div class="poker-table">
      <h2 id="game-info" style="margin-top: 0; font-size: 1.3rem;">Modus: OMAHA | Fase: VENTING</h2>
      
      <div id="board-cards" class="cards-container"></div>

      <div id="players-list" class="players-container"></div>
    </div>

    <div class="qr-box">
      <p style="margin: 0 0 8px 0; font-size: 0.85rem; font-weight: bold;">Skann for å bli med:</p>
      <div id="qrcode"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn-mode" onclick="setMode('TEXAS')">Texas Hold'em</button>
    <button class="btn-mode" onclick="setMode('OMAHA')">Omaha</button>
    <button class="btn-action" onclick="startNewHand()">Start Ny Hånd</button>
    <button id="btn-next-phase" class="btn-next" onclick="nextPhase()">Åpne Flopp</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const mobileUrl = window.location.origin + '/mobile.html';
    new QRCode(document.getElementById("qrcode"), {
      text: mobileUrl,
      width: 95,
      height: 95
    });

    function formatCard(cardCode) {
      if (!cardCode) return '';
      let value = cardCode.slice(0, -1).toUpperCase();
      if (value === 'T') value = '10';
      const suitChar = cardCode.slice(-1).toLowerCase();
      
      const suits = {
        'h': { symbol: '♥', color: 'red' },
        'd': { symbol: '♦', color: 'red' },
        'c': { symbol: '♣', color: 'black' },
        's': { symbol: '♠', color: 'black' }
      };
      
      const suit = suits[suitChar] || { symbol: suitChar, color: 'black' };
      return `<div class="card ${suit.color}"><span class="card-val">${value}</span><span class="card-suit">${suit.symbol}</span></div>`;
    }

    function setMode(mode) { socket.emit('set_game_mode', mode); }
    function startNewHand() { socket.emit('start_new_hand'); }
    function nextPhase() { socket.emit('next_phase'); }

    socket.on('state_update', (state) => {
      document.getElementById('game-info').innerText = `Modus: ${state.gameMode} | Fase: ${state.phase}`;
      
      const nextBtn = document.getElementById('btn-next-phase');
      if (state.phase === 'PREFLOP') {
        nextBtn.innerText = 'Åpne Flopp';
      } else if (state.phase === 'FLOP') {
        nextBtn.innerText = 'Åpne Turn';
      } else if (state.phase === 'TURN') {
        nextBtn.innerText = 'Åpne River';
      } else if (state.phase === 'RIVER') {
        nextBtn.innerText = 'Vis Vinner (Showdown)';
      } else if (state.phase === 'SHOWDOWN') {
        nextBtn.innerText = 'Runde Ferdig';
      } else {
        nextBtn.innerText = 'Neste Fase';
      }

      const banner = document.getElementById('winner-banner');
      if (state.winnerInfo) {
        banner.innerHTML = `🏆 VINNER: ${state.winnerInfo.winnerName} (${state.winnerInfo.descr})`;
        banner.style.display = 'block';
      } else {
        banner.style.display = 'none';
      }

      const boardContainer = document.getElementById('board-cards');
      boardContainer.innerHTML = state.board.map(c => formatCard(c)).join('');

      const playersContainer = document.getElementById('players-list');
      playersContainer.innerHTML = state.players.map(p => `
        <div class="player-card">
          <div><strong>${p.name}</strong></div>
          <div style="font-size: 0.8rem; color: #ccc;">Plass ${p.seat}</div>
          ${p.role ? `<span class="badge">${p.role}</span>` : ''}
          <div style="font-size: 0.8rem; margin-top: 4px;">
            ${p.folded ? '🔴 FOLDET' : '🟢 INNE'}
          </div>
          ${p.cards && p.cards.length > 0 ? `
            <div style="margin-top: 6px; display: flex; gap: 4px; justify-content: center;">
              ${p.cards.map(c => formatCard(c)).join('')}
            </div>
          ` : ''}
        </div>
      `).join('');
    });
  </script>
</body>
</html>
