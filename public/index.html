<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Løland Gård Poker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="stylesheet" href="/css/tema.css">
  <link rel="stylesheet" href="/felt.css">
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000; /* svarte kanter når vinduet ikke er 16:9 */
      font-family: var(--font-tekst);
      color: var(--tekst);
    }

    /* ------------------------------------------------------------
       Fast scene på 1920 x 1080 som skaleres til vinduet (fitScene).
       Alle mål under er i scenens piksler.
       ------------------------------------------------------------ */
    #scene {
      position: fixed;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: 0 0;
      background: var(--bakgrunn);
      overflow: hidden;
    }

    /* ---------------- Topplinje (0–112 px) ---------------- */
    .topplinje {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 112px;
      padding: 0 48px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }
    .logo {
      font-family: var(--font-tittel);
      font-weight: 700;
      font-size: 34px;
      letter-spacing: 1px;
      color: var(--gull);
      white-space: nowrap;
    }

    .fasespor { display: flex; gap: 12px; }
    .fase {
      font-size: 24px;
      font-weight: 600;
      padding: 8px 22px;
      border-radius: 999px;
      border: 2px solid transparent;
      color: var(--tekst-svak);
    }
    .fase.passert { color: var(--gull); border-color: var(--gull); }
    .fase.aktiv { background: var(--gull); color: var(--bakgrunn); border-color: var(--gull); font-weight: 800; }

    .omgang-info {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 22px;
      text-align: right;
    }
    .omgang-tittel { font-size: 26px; font-weight: 700; }
    .omgang-med { font-size: 19px; color: var(--tekst-dempet); margin-top: 2px; }
    .qr-liten {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 14px;
      font-weight: 600;
      color: var(--tekst-dempet);
    }
    .qr-liten .qr-bilde {
      width: 64px;
      height: 64px;
      padding: 4px;
      background: #fff;
      border-radius: 6px;
    }
    .qr-bilde img, .qr-bilde canvas { display: block; width: 100%; height: 100%; }

    /* ---------------- Bordet ---------------- */
    .bord {
      position: absolute;
      left: 300px;
      top: 250px;
      width: 1340px;
      height: 580px;
      border-radius: 120px;
      background:
        var(--felt-noise),
        radial-gradient(ellipse at 50% 50%, var(--filt) 0%, var(--filt-mork) 100%);
      background-size: 240px 240px, 100% 100%;
      /* Treramme: to ringer utenpå + indre skygge */
      box-shadow:
        0 0 0 22px var(--treramme),
        0 0 0 26px var(--treramme-ytre),
        0 18px 50px 26px rgba(0, 0, 0, 0.55),
        inset 0 0 70px rgba(0, 0, 0, 0.55);
    }

    /* Kortsiden til høyre: der står skjermen */
    .skjerm-merke {
      position: absolute;
      left: 1680px;
      top: 514px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border: 2px dashed var(--linje);
      border-radius: 10px;
      font-size: 16px;
      color: var(--tekst-svak);
    }
    .skjerm-merke svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* Fellesskortene midt på bordet */
    .fellesskort {
      position: absolute;
      left: 658px;
      top: 450px;
      display: flex;
      gap: 16px;
    }
    .fellesskort .kort, .fellesskort .kort-plass { width: 112px; height: 156px; }
    .fellesskort .kort { font-size: 58px; }

    .spill-info {
      position: absolute;
      left: 300px;
      width: 1340px;
      top: 628px;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--tekst-dempet);
    }
    .bord-pynt {
      position: absolute;
      left: 300px;
      width: 1340px;
      top: 664px;
      text-align: center;
      font-family: var(--font-tittel);
      font-weight: 700;
      font-size: 26px;
      letter-spacing: 8px;
      color: rgba(212, 168, 75, 0.2);
    }
    .bord-pynt.skjult { display: none; }

    /* ---------------- Seter ---------------- */
    .sete {
      position: absolute;
      width: 250px;
      height: 168px;
      transform: translate(-50%, -50%);
      padding: 18px 20px;
      border-radius: 22px;
      background: var(--flate);
      border: 2px solid var(--linje);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.5);
      color: var(--tekst);
      font-family: var(--font-tekst);
      text-align: left;
      cursor: pointer;
    }
    .sete.smal { width: 220px; padding: 16px 16px; }
    .sete.dealer { border-color: var(--gull); }

    .sete-innhold {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      transition: opacity 0.3s ease, filter 0.3s ease;
    }
    .sete-topp { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .avatar {
      flex: 0 0 56px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }
    .navn {
      font-size: 28px;
      font-weight: 600;
      line-height: 1.1;
      min-width: 0;
      overflow: hidden;
      /* Navn med mellomrom kan gå over to linjer, ellers «…» */
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow-wrap: anywhere;
    }
    .navn.langt { font-size: 24px; }
    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 19px;
      font-weight: 500;
      color: var(--tekst-dempet);
      white-space: nowrap;
      overflow: hidden;
    }
    .prikk { flex: 0 0 12px; width: 12px; height: 12px; border-radius: 50%; background: var(--tekst-svak); }

    /* Statusene skilles på lysstyrke, ikke bare tekst */
    .sete.i-hand .prikk { background: var(--gull); }
    .sete.i-hand .status { color: var(--tekst); }
    .sete.kastet .sete-innhold { opacity: 0.38; }
    .sete.venter .sete-innhold { opacity: 0.6; }
    .sete.ute { border-style: dashed; }
    .sete.ute .sete-innhold { opacity: 0.4; filter: grayscale(1); }
    .sete.vinner { border-color: var(--gull-lys); }
    .sete.vinner .status { color: var(--gull-lys); font-weight: 700; }
    .sete.vinner .prikk { background: var(--gull-lys); }

    /* Frakoblet: eget merke over øvre høyre hjørne (dempes ikke sammen med setet) */
    .frakoblet {
      position: absolute;
      top: -18px;
      right: -14px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--varsel-bakgrunn);
      border: 2px solid var(--varsel);
      color: var(--varsel);
      font-size: 16px;
      font-weight: 700;
    }
    .frakoblet svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.4; animation: puls 1.6s ease-in-out infinite; }
    @keyframes puls { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* Markører på filten */
    .markorer .markor {
      position: absolute;
      transform: translate(-50%, -50%);
    }

    /* ---------------- Midlertidig knapperad (erstattes av nye kontroller) ---------------- */
    .midlertidig {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 20px;
      display: flex;
      justify-content: center;
      gap: 12px;
    }
    .midlertidig button {
      font: 600 20px var(--font-tekst);
      padding: 14px 22px;
      border-radius: 12px;
      border: 2px solid var(--linje);
      background: var(--flate-knapp);
      color: var(--tekst);
      cursor: pointer;
    }
    .midlertidig button.hoved { background: var(--gull); color: var(--bakgrunn); border-color: var(--gull); }
    .midlertidig button:disabled { opacity: 0.35; cursor: default; }
  </style>
</head>
<body>
  <div id="scene">

    <!-- Topplinje: logo, fasespor, omgang + liten QR-kode -->
    <header class="topplinje">
      <div class="logo">Løland Gård Poker</div>
      <div class="fasespor" id="fasespor"></div>
      <div class="omgang-info" id="omgang-info">
        <div>
          <div class="omgang-tittel" id="omgang-tittel"></div>
          <div class="omgang-med" id="omgang-med"></div>
        </div>
        <div class="qr-liten">
          <div class="qr-bilde" id="qr-liten"></div>
          <span>Bli med</span>
        </div>
      </div>
    </header>

    <!-- Bordet, sett ovenfra. Skjermen står på kortsiden til høyre. -->
    <div class="bord"></div>
    <div class="skjerm-merke">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
      Skjermen
    </div>

    <div class="fellesskort" id="fellesskort"></div>
    <div class="spill-info" id="spill-info"></div>
    <div class="bord-pynt" id="bord-pynt" aria-hidden="true">LØLAND GÅRD</div>

    <div class="markorer" id="markorer"></div>
    <div id="seter"></div>

    <!-- Midlertidig: dagens knapper til de nye kontrollene er på plass -->
    <div class="midlertidig">
      <button onclick="socket.emit('set_game_mode', 'TEXAS')">Texas</button>
      <button onclick="socket.emit('set_game_mode', 'OMAHA')">Omaha</button>
      <button id="midl-hoved" class="hoved" onclick="hovedKlikk()">Start ny hånd</button>
      <button onclick="if (confirm('Ny omgang?')) socket.emit('host_reset_out')">Ny omgang</button>
      <button onclick="if (confirm('Kaste ut alle?')) socket.emit('host_kick_all')">Nytt spill</button>
      <button onclick="window.open('/board.html', 'PokerBoard', 'width=1200,height=800')">Bordvisning</button>
    </div>
  </div>

  <script src="/suits.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let lastState = null;

    // ============================================================
    // Skalering: scenen på 1920 x 1080 fyller vinduet og beholder 16:9
    // ============================================================
    const scene = document.getElementById('scene');
    function fitScene() {
      const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      const x = (window.innerWidth - 1920 * s) / 2;
      const y = (window.innerHeight - 1080 * s) / 2;
      scene.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
    }
    window.addEventListener('resize', fitScene);
    fitScene();

    // ============================================================
    // Plassene rundt bordet (scenens piksler), for hvert antall spillere.
    // Sete 1 sitter nede nærmest skjermen, resten følger med klokka sett
    // ovenfra: langsiden nede (mot venstre), venstre kortside (oppover),
    // langsiden oppe (mot høyre). Høyre kortside er tom – der står skjermen.
    // Hver plass: [x, y] for setets midtpunkt og [x, y] for markørene.
    // Stemmer ikke retningen med det fysiske bordet, kan listene speilvendes her.
    // ============================================================
    const NEDE = (x) => ({ sete: [x, 830], markor: [x, 700] });
    const OPPE = (x) => ({ sete: [x, 250], markor: [x, 380] });
    const VENSTRE = (y) => ({ sete: [300, y], markor: [470, y] });
    const PLASSER = {
      1: [NEDE(1238)],
      2: [NEDE(970), OPPE(970)],
      3: [NEDE(970), VENSTRE(540), OPPE(970)],
      4: [NEDE(1238), NEDE(702), OPPE(702), OPPE(1238)],
      5: [NEDE(1238), NEDE(702), VENSTRE(540), OPPE(702), OPPE(1238)],
      6: [NEDE(1238), NEDE(702), VENSTRE(640), VENSTRE(440), OPPE(702), OPPE(1238)],
      7: [NEDE(1330), NEDE(970), NEDE(610), VENSTRE(540), OPPE(610), OPPE(970), OPPE(1330)],
      8: [NEDE(1330), NEDE(970), NEDE(610), VENSTRE(640), VENSTRE(440), OPPE(610), OPPE(970), OPPE(1330)]
    };

    // ============================================================
    // Hjelpere
    // ============================================================
    function escapeHtml(text) {
      return String(text == null ? '' : text)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // Kort med verdi og farge sentrert (tema.css). Bildekort brukes bare på projektoren.
    function kortHtml(code, nytt) {
      const verdi = code.slice(0, -1).toUpperCase() === 'T' ? '10' : code.slice(0, -1).toUpperCase();
      const farge = code.slice(-1).toLowerCase();
      const rod = farge === 'h' || farge === 'd';
      return `<div class="kort ${rod ? 'rod' : ''} ${nytt ? 'snu' : ''}">` +
             `<span class="kort-verdi">${verdi}</span><span class="kort-farge">${suitIcon(farge)}</span></div>`;
    }

    function initialer(navn) {
      const ord = String(navn).trim().split(/\s+/).filter(Boolean);
      const bokstaver = ord.length > 1 ? ord[0][0] + ord[1][0] : (ord[0] || '?')[0];
      return bokstaver.toUpperCase();
    }

    // Fast avatarfarge per spiller: tildeles første gang navnet dukker opp,
    // og er ikke i bruk av noen andre ved bordet
    const AVATARFARGER = ['#8E3B46', '#3B6E8E', '#7A5C2E', '#4E7A3B', '#6B4C8E', '#2E7A72', '#8E5E3B', '#5A6470'];
    let avatarFarger = {};
    try { avatarFarger = JSON.parse(localStorage.getItem('poker_avatarfarger') || '{}') || {}; } catch (e) { avatarFarger = {}; }
    function avatarFarge(navn, alleNavn) {
      const key = navn.toLowerCase();
      const iBruk = alleNavn.filter(n => n.toLowerCase() !== key).map(n => avatarFarger[n.toLowerCase()]);
      if (!avatarFarger[key] || iBruk.includes(avatarFarger[key])) {
        avatarFarger[key] = AVATARFARGER.find(f => !iBruk.includes(f)) || AVATARFARGER[0];
        try { localStorage.setItem('poker_avatarfarger', JSON.stringify(avatarFarger)); } catch (e) { /* ignorer */ }
      }
      return avatarFarger[key];
    }

    const AKTIVE_FASER = ['PREFLOP', 'FLOP', 'TURN', 'RIVER'];
    function erVinner(state, p) {
      const winners = (state.winnerInfo && state.winnerInfo.winners) || [];
      return ['SHOWDOWN', 'FINISHED'].includes(state.phase) && winners.includes(p.name);
    }

    // ============================================================
    // QR-kode til mobilsiden. Er statusskjermen åpnet via localhost, kan ikke
    // telefonene bruke den adressen – da brukes serverens adresse på lokalnettet.
    // ============================================================
    async function mobilAdresse() {
      let origin = window.location.origin;
      const isLocalhost = ['localhost', '127.0.0.1', '::1', '[::1]'].includes(window.location.hostname);
      if (isLocalhost) {
        try {
          const info = await (await fetch('/api/server-info')).json();
          if (info.lanAddresses && info.lanAddresses.length > 0) {
            origin = `${window.location.protocol}//${info.lanAddresses[0]}:${window.location.port || info.port}`;
          }
        } catch (e) { /* bruk origin som den er */ }
      }
      return origin + '/mobile.html';
    }
    mobilAdresse().then(url => {
      // Tegnes i høy oppløsning og skaleres ned med CSS, så koden blir skarp
      if (typeof QRCode === 'function') new QRCode(document.getElementById('qr-liten'), { text: url, width: 256, height: 256 });
    });

    // ============================================================
    // Tegning av tavlen
    // ============================================================
    const FASER = ['PREFLOP', 'FLOP', 'TURN', 'RIVER', 'SHOWDOWN'];
    const FASENAVN = ['Preflop', 'Flop', 'Turn', 'River', 'Showdown'];

    function tegnFasespor(state) {
      let aktiv = FASER.indexOf(state.phase);
      let navn = FASENAVN.slice();
      let passertTil = aktiv - 1;
      if (state.phase === 'FINISHED') {
        // Avgjort før showdown: fasene fram til siste åpnede kort er passert
        navn[4] = 'Avgjort';
        aktiv = 4;
        passertTil = { 0: 0, 3: 1, 4: 2, 5: 3 }[(state.board || []).length] ?? 0;
      }
      document.getElementById('fasespor').innerHTML = navn.map((n, i) => {
        const klasse = i === aktiv ? 'aktiv' : (i <= passertTil ? 'passert' : '');
        return `<span class="fase ${klasse}">${n}</span>`;
      }).join('');
    }

    function tegnOmgang(state) {
      const med = state.players.filter(p => !p.out).length;
      document.getElementById('omgang-tittel').innerText = state.roundNumber ? `Omgang ${state.roundNumber}` : 'Ny omgang';
      document.getElementById('omgang-med').innerText = `${med} av ${state.players.length} med`;
    }

    let forrigeBord = [];
    function tegnFellesskort(state) {
      const board = state.board || [];
      const html = [];
      for (let i = 0; i < 5; i++) {
        if (board[i]) html.push(kortHtml(board[i], forrigeBord[i] !== board[i]));
        else html.push('<div class="kort-plass"></div>');
      }
      document.getElementById('fellesskort').innerHTML = html.join('');
      forrigeBord = board.slice();

      const spill = state.gameMode === 'OMAHA' ? 'Pot-Limit Omaha' : state.gameMode === 'TEXAS' ? "Texas Hold'em" : '';
      const hand = state.handNumber > 0 && state.phase !== 'VENTING' ? `Hånd ${state.handNumber}` : '';
      document.getElementById('spill-info').innerText = [spill, hand].filter(Boolean).join(' · ');
    }

    function statusFor(state, p) {
      if (p.out) return { klasse: 'ute', tekst: 'Ute' };
      if (p.waiting) return { klasse: 'venter', tekst: 'Med fra neste hånd' };
      if (erVinner(state, p)) return { klasse: 'vinner', tekst: 'Vinner' };
      if (state.phase === 'VENTING') return { klasse: '', tekst: 'Klar' };
      if (p.folded) return { klasse: 'kastet', tekst: 'Kastet' };
      return { klasse: 'i-hand', tekst: 'I hånden' };
    }

    function tegnSeter(state) {
      const spillere = state.players;
      const plasser = PLASSER[Math.min(spillere.length, 8)] || [];
      const alleNavn = spillere.map(p => p.name);
      const smal = spillere.length >= 7;

      document.getElementById('seter').innerHTML = spillere.map((p, i) => {
        const plass = plasser[i];
        if (!plass) return '';
        const st = statusFor(state, p);
        const dealer = (p.role || '').startsWith('Dealer');
        return `
          <button class="sete ${st.klasse} ${dealer ? 'dealer' : ''} ${smal ? 'smal' : ''}"
                  style="left: ${plass.sete[0]}px; top: ${plass.sete[1]}px"
                  data-seat="${Number(p.seat)}" aria-label="${escapeHtml(p.name)}, sete ${Number(p.seat)}">
            <div class="sete-innhold">
              <div class="sete-topp">
                <div class="avatar" style="background: ${avatarFarge(p.name, alleNavn)}">${escapeHtml(initialer(p.name))}</div>
                <div class="navn ${p.name.length > 9 ? 'langt' : ''}">${escapeHtml(p.name)}</div>
              </div>
              <div class="status"><span class="prikk"></span>${st.tekst}</div>
            </div>
            ${!p.connected ? `<div class="frakoblet">
              <svg viewBox="0 0 24 24"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16.1a5 5 0 0 1 7 0M3 3l18 18"/></svg>
              Frakoblet</div>` : ''}
          </button>`;
      }).join('');

      // Markører på filten foran setet. Med to spillere får dealeren både D og SB.
      const markorer = [];
      spillere.forEach((p, i) => {
        const plass = plasser[i];
        if (!plass || !p.role) return;
        const [x, y] = plass.markor;
        if (p.role === 'Dealer / Lilleblind') {
          markorer.push(`<div class="markor markor-d" style="left: ${x - 34}px; top: ${y}px">D</div>`);
          markorer.push(`<div class="markor markor-sb" style="left: ${x + 34}px; top: ${y}px">SB</div>`);
        } else if (p.role === 'Dealer') {
          markorer.push(`<div class="markor markor-d" style="left: ${x}px; top: ${y}px">D</div>`);
        } else if (p.role === 'Lilleblind') {
          markorer.push(`<div class="markor markor-sb" style="left: ${x}px; top: ${y}px">SB</div>`);
        } else if (p.role === 'Storeblind') {
          markorer.push(`<div class="markor markor-bb" style="left: ${x}px; top: ${y}px">BB</div>`);
        }
      });
      document.getElementById('markorer').innerHTML = markorer.join('');

      // Pynteteksten under kortene skjules når en markør ville havnet oppå den
      const midtMarkor = plasser.some(pl => pl.markor[0] === 970);
      document.getElementById('bord-pynt').classList.toggle('skjult', midtMarkor);
    }

    // Midlertidig hovedknapp (erstattes av de nye kontrollene)
    function hovedKlikk() {
      if (!lastState) return;
      if (lastState.phase === 'VENTING' || lastState.phase === 'SHOWDOWN' || lastState.phase === 'FINISHED') socket.emit('start_new_hand');
      else socket.emit('next_phase');
    }

    socket.on('state_update', (state) => {
      lastState = state;
      tegnFasespor(state);
      tegnOmgang(state);
      tegnFellesskort(state);
      tegnSeter(state);
      document.getElementById('midl-hoved').disabled = !state.gameMode || !!state.roundWinner;
    });
  </script>
</body>
</html>
