<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poker Dashboard</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 20px;
      color: #ffffff;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 20px;
    }
    .card {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: #4caf50;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 10px 8px;
      text-align: left;
      border-bottom: 1px solid #2a2a2a;
      font-size: 0.95rem;
    }
    th {
      color: #888;
      font-weight: 600;
    }
    .rank-badge {
      display: inline-block;
      width: 24px;
      height: 24px;
      line-height: 24px;
      text-align: center;
      background-color: #333;
      color: #fff;
      border-radius: 50%;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .top3 {
      background-color: #ffb300;
      color: #000;
    }
    .win-rate {
      color: #81c784;
      font-weight: bold;
    }
    .time-col {
      color: #aaa;
      font-size: 0.85rem;
    }
    .actions-bar {
      margin-top: 30px;
      padding-top: 15px;
      border-top: 1px solid #333;
      display: flex;
      justify-content: flex-end;
    }
    .btn-reset {
      background-color: #d32f2f;
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .btn-reset:hover {
      background-color: #b71c1c;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Poker Dashboard</h1>
    
    <div class="grid">
      <!-- Spillstatistikk -->
      <div class="card">
        <h2>Spillerstatistikk</h2>
        <table id="player-stats-table">
          <thead>
            <tr>
              <th>Spiller</th>
              <th>Hender Spilt</th>
              <th>Hender Vunnet</th>
              <th>Seiersprosent</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- Top 10 beste vinnerhender -->
      <div class="card">
        <h2>Top 10 Beste Vinnerhender (Spillekveld)</h2>
        <table id="winning-hands-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Spiller</th>
              <th>Vinnerhånd</th>
              <th>Tidspunkt</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- Handlingsbar med knapp for å tømme databasen -->
    <div class="actions-bar">
      <button class="btn-reset" onclick="resetDatabase()">⚠️ Tøm databasen for testdata</button>
    </div>
  </div>

  <script>
    async function loadDashboardData() {
      try {
        // 1. Spillerstatistikk fra /api/stats
        const statsRes = await fetch('/api/stats');
        if (statsRes.ok) {
          const stats = await statsRes.json();
          const statsBody = document.querySelector('#player-stats-table tbody');
          statsBody.innerHTML = '';
          
          stats.forEach(p => {
            const pct = p.hands_played > 0 
              ? ((p.hands_won / p.hands_played) * 100).toFixed(1) + '%' 
              : '0%';

            const row = document.createElement('tr');
            row.innerHTML = `
              <td><strong>${p.name}</strong></td>
              <td>${p.hands_played}</td>
              <td>${p.hands_won}</td>
              <td><span class="win-rate">${pct}</span></td>
            `;
            statsBody.appendChild(row);
          });
        }

        // 2. Top 10 Vinnerhender fra /api/winning-hands
        const handsRes = await fetch('/api/winning-hands');
        if (handsRes.ok) {
          const hands = await handsRes.json();
          const handsBody = document.querySelector('#winning-hands-table tbody');
          handsBody.innerHTML = '';

          hands.forEach((h, index) => {
            const timeStr = h.created_at 
              ? new Date(h.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) 
              : '-';

            const badgeClass = index < 3 ? 'rank-badge top3' : 'rank-badge';

            const row = document.createElement('tr');
            row.innerHTML = `
              <td><span class="${badgeClass}">${index + 1}</span></td>
              <td><strong>${h.player_name}</strong></td>
              <td>${h.hand_description}</td>
              <td class="time-col">${timeStr}</td>
            `;
            handsBody.appendChild(row);
          });
        }

      } catch (err) {
        console.error('Feil ved oppdatering av dashboard:', err);
      }
    }

    async function resetDatabase() {
      const confirmed = confirm("Er du sikker på at du vil tømme databasen for all testdata? Dette kan ikke angres.");
      if (!confirmed) return;

      try {
        const res = await fetch('/api/reset-db', { method: 'POST' });
        if (res.ok) {
          alert("Databasen er nå tømt!");
          loadDashboardData();
        } else {
          alert("Feil ved tømming av database.");
        }
      } catch (err) {
        alert("Kunne ikke kontakte serveren for å tømme databasen.");
      }
    }

    loadDashboardData();
    setInterval(loadDashboardData, 4000);
  </script>
</body>
</html>
