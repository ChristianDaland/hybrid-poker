<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poker Dashboard</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 20px;
      color: #ffffff;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .card {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: #4caf50;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 10px 8px;
      text-align: left;
      border-bottom: 1px solid #2a2a2a;
      font-size: 0.95rem;
    }
    th {
      color: #888;
      font-weight: 600;
    }
    code {
      background-color: #2b2b2b;
      padding: 3px 6px;
      border-radius: 4px;
      color: #ffca28;
      font-size: 0.85em;
    }
    .win-rate {
      color: #81c784;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Poker Dashboard</h1>
    
    <div class="grid">
      <!-- Spillstatistikk -->
      <div class="card">
        <h2>Spillerstatistikk</h2>
        <table id="player-stats-table">
          <thead>
            <tr>
              <th>Spiller</th>
              <th>Hender Spilt</th>
              <th>Hender Vunnet</th>
              <th>Seiersprosent</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- Siste Viste Hender -->
      <div class="card">
        <h2>Siste Viste Hender</h2>
        <table id="winning-hands-table">
          <thead>
            <tr>
              <th>Tidspunkt</th>
              <th>Vinner</th>
              <th>Hånd</th>
              <th>Visning / Kort</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    async function loadDashboardData() {
      try {
        // 1. Spillerstatistikk fra /api/stats
        const statsRes = await fetch('/api/stats');
        if (statsRes.ok) {
          const stats = await statsRes.json();
          const statsBody = document.querySelector('#player-stats-table tbody');
          statsBody.innerHTML = '';
          
          stats.forEach(p => {
            const pct = p.hands_played > 0 
              ? ((p.hands_won / p.hands_played) * 100).toFixed(1) + '%' 
              : '0%';

            const row = document.createElement('tr');
            row.innerHTML = `
              <td><strong>${p.name}</strong></td>
              <td>${p.hands_played}</td>
              <td>${p.hands_won}</td>
              <td><span class="win-rate">${pct}</span></td>
            `;
            statsBody.appendChild(row);
          });
        }

        // 2. Viste hender fra /api/winning-hands
        const handsRes = await fetch('/api/winning-hands');
        if (handsRes.ok) {
          const hands = await handsRes.json();
          const handsBody = document.querySelector('#winning-hands-table tbody');
          handsBody.innerHTML = '';

          hands.forEach(h => {
            let cardDetails = '-';
            if (h.winning_cards) {
              try {
                const parsed = JSON.parse(h.winning_cards);
                const boardStr = parsed.board ? `[${parsed.board.join(' ')}] ` : '';
                const playersCards = parsed.cards 
                  ? parsed.cards.map(c => `${c.name}: ${c.cards.join(',')}`).join(' | ') 
                  : '';
                cardDetails = `${boardStr}${playersCards}`;
              } catch (e) {
                cardDetails = h.winning_cards;
              }
            }

            const timeStr = h.created_at 
              ? new Date(h.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) 
              : '-';

            const row = document.createElement('tr');
            row.innerHTML = `
              <td>${timeStr}</td>
              <td><strong>${h.player_name}</strong></td>
              <td>${h.hand_description}</td>
              <td><code>${cardDetails}</code></td>
            `;
            handsBody.appendChild(row);
          });
        }

      } catch (err) {
        console.error('Feil ved oppdatering av dashboard:', err);
      }
    }

    loadDashboardData();
    setInterval(loadDashboardData, 4000);
  </script>
</body>
</html>
