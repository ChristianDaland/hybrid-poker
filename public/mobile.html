<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spiller - Hybrid Poker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: white;
      text-align: center;
      margin: 0;
      padding: 15px;
    }

    .status-bar {
      background-color: #333;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .role-bar {
      background-color: #ff5722;
      color: white;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .cards-area {
      border: 2px dashed #2e7d32;
      background-color: #1b4d2e;
      border-radius: 12px;
      padding: 20px 10px;
      min-height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 25px;
    }

    /* Stiling for kort */
    .card {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      border-radius: 8px;
      width: 55px;
      height: 80px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
      font-weight: bold;
    }
    .card.red { color: #d9534f; }
    .card.black { color: #222222; }
    .card-val { font-size: 1.3rem; line-height: 1; }
    .card-suit { font-size: 1.5rem; line-height: 1; }

    .btn-fold {
      background-color: #e57373;
      color: white;
      border: none;
      width: 100%;
      padding: 15px;
      font-size: 1.2rem;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-container {
      margin-top: 50px;
    }
    input[type="text"] {
      padding: 12px;
      font-size: 1rem;
      border-radius: 6px;
      border: none;
      width: 80%;
      max-width: 250px;
      margin-bottom: 10px;
    }
    .btn-join {
      background-color: #4caf50;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="login-screen" class="login-container">
    <h2>Velkommen til Pokertilbehøret</h2>
    <input type="text" id="player-name" placeholder="Skriv ditt navn..." />
    <br>
    <button class="btn-join" onclick="joinGame()">Koble til</button>
  </div>

  <div id="game-screen" style="display: none;">
    <div id="status-bar" class="status-bar">VENTER...</div>
    <div id="role-bar" class="role-bar" style="display: none;"></div>

    <div id="my-cards" class="cards-area"></div>

    <button class="btn-fold" onclick="fold()">Fold (Kast deg)</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    function formatCard(cardCode) {
      if (!cardCode) return '';
      const value = cardCode.slice(0, -1).toUpperCase();
      const suitChar = cardCode.slice(-1).toLowerCase();
      
      const suits = {
        'h': { symbol: '♥', color: 'red' },
        'd': { symbol: '♦', color: 'red' },
        'c': { symbol: '♣', color: 'black' },
        's': { symbol: '♠', color: 'black' }
      };
      
      const suit = suits[suitChar] || { symbol: suitChar, color: 'black' };
      return `<div class="card ${suit.color}"><span class="card-val">${value}</span><span class="card-suit">${suit.symbol}</span></div>`;
    }

    function joinGame() {
      const name = document.getElementById('player-name').value.trim();
      if (name) {
        socket.emit('join_game', name);
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
      }
    }

    function fold() {
      socket.emit('player_fold');
    }

    socket.on('player_state', (data) => {
      document.getElementById('status-bar').innerText = `Fase: ${data.phase}`;
      
      const roleBar = document.getElementById('role-bar');
      if (data.role) {
        roleBar.innerText = `DU ER ${data.role}`;
        roleBar.style.display = 'block';
      } else {
        roleBar.style.display = 'none';
      }

      const cardsContainer = document.getElementById('my-cards');
      if (data.cards && data.cards.length > 0) {
        cardsContainer.innerHTML = data.cards.map(c => formatCard(c)).join('');
      } else {
        cardsContainer.innerHTML = '<span style="color: #aaa;">Ingen kort utdelt ennå</span>';
      }
    });
  </script>
</body>
</html>
