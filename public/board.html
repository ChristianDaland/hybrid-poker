<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Løland Gård Poker - Bordvisning</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background-color: #1b4d2e;
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Zoom-kontroll øverst i hjørnet */
    .zoom-controls {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 6px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      z-index: 10;
    }

    .zoom-btn {
      background: #1e88e5;
      color: white;
      border: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      padding: 0;
    }

    .zoom-btn:hover { background: #2196f3; }

    /* Skalerbar beholder for kortene */
    .board-wrapper {
      transform-origin: center center;
      transition: transform 0.15s ease-out;
    }

    .cards-container {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .card {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      border-radius: 12px;
      width: 140px;
      height: 195px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      font-weight: bold;
      position: relative;
    }

    .card.red { color: #d9534f; }
    .card.black { color: #222222; }

    .card-val { font-size: 3.2rem; line-height: 1; position: absolute; top: 12px; left: 14px; }
    .card-suit { font-size: 4rem; line-height: 1; }

    .card-suit-small {
      font-size: 1.8rem;
      position: absolute;
      bottom: 12px;
      right: 14px;
    }
  </style>
</head>
<body>

  <!-- Zoom-kontroll -->
  <div class="zoom-controls">
    <span>Kortstørrelse:</span>
    <button class="zoom-btn" onclick="adjustZoom(-0.1)">-</button>
    <span id="zoom-val">100%</span>
    <button class="zoom-btn" onclick="adjustZoom(0.1)">+</button>
    <button class="zoom-btn" style="width: auto; padding: 0 8px; border-radius: 10px; font-size: 0.75rem;" onclick="resetZoom()">Nullstill</button>
  </div>

  <!-- Kortområde som skaleres -->
  <div id="board-wrapper" class="board-wrapper">
    <div id="board-cards" class="cards-container"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    // Zoom-håndtering
    let currentScale = parseFloat(localStorage.getItem('board_zoom')) || 1.0;

    function applyZoom() {
      document.getElementById('board-wrapper').style.transform = `scale(${currentScale})`;
      document.getElementById('zoom-val').innerText = `${Math.round(currentScale * 100)}%`;
      localStorage.setItem('board_zoom', currentScale);
    }

    function adjustZoom(delta) {
      currentScale = Math.min(Math.max(0.5, currentScale + delta), 2.5); // Grenser fra 50% til 250%
      applyZoom();
    }

    function resetZoom() {
      currentScale = 1.0;
      applyZoom();
    }

    // Aktiver lagret zoom ved oppstart
    applyZoom();

    function formatCard(cardCode) {
      if (!cardCode) return '';
      let value = cardCode.slice(0, -1).toUpperCase();
      if (value === 'T') value = '10';
      const suitChar = cardCode.slice(-1).toLowerCase();
      
      const suits = {
        'h': { symbol: '♥', color: 'red' },
        'd': { symbol: '♦', color: 'red' },
        'c': { symbol: '♣', color: 'black' },
        's': { symbol: '♠', color: 'black' }
      };
      
      const suit = suits[suitChar] || { symbol: suitChar, color: 'black' };
      return `
        <div class="card ${suit.color}">
          <span class="card-val">${value}</span>
          <span class="card-suit">${suit.symbol}</span>
          <span class="card-suit-small">${suit.symbol}</span>
        </div>
      `;
    }

    socket.on('state_update', (state) => {
      const boardContainer = document.getElementById('board-cards');
      if (state.board && state.board.length > 0) {
        boardContainer.innerHTML = state.board.map(c => formatCard(c)).join('');
      } else {
        boardContainer.innerHTML = '';
      }
    });
  </script>
</body>
</html>
