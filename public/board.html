<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Løland Gård Poker - Bordkort</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b4028; /* Mørkegrønn pokerfilt */
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .board-container {
      display: flex;
      gap: 25px;
      justify-content: center;
      align-items: center;
      width: 95vw;
      max-width: 1400px;
      perspective: 1000px;
    }

    /* Ekte kort-design */
    .card {
      width: 17vw;
      height: 25vw;
      max-width: 210px;
      max-height: 310px;
      background: #ffffff;
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
      border: 1px solid #ddd;
      user-select: none;
      position: relative;
    }

    /* Animasjon ved utdeling */
    .card-animate {
      animation: dealCard 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes dealCard {
      0% {
        opacity: 0;
        transform: translateY(-50px) scale(0.7) rotateY(90deg);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1) rotateY(0deg);
      }
    }

    /* Farger */
    .card.red { color: #d32f2f; }
    .card.black { color: #111111; }

    /* Hjørner */
    .card-corner-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: max-content;
      line-height: 0.9;
    }

    .card-corner-bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: max-content;
      align-self: flex-end;
      transform: rotate(180deg);
      line-height: 0.9;
    }

    .corner-val {
      font-size: 2.2rem;
      font-weight: bold;
    }

    .corner-suit {
      font-size: 2rem;
    }

    /* Midtområde for pips (symboler) */
    .card-center {
      position: absolute;
      top: 45px;
      bottom: 45px;
      left: 35px;
      right: 35px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      justify-items: center;
      font-size: 1.8rem;
    }

    /* Spesifikk styling for ess */
    .card-center.ace {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 4.5rem;
    }

    /* Styling for Bildekort (J, Q, K) */
    .card-center.face-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 2px dashed rgba(0,0,0,0.15);
      border-radius: 8px;
      background: rgba(0,0,0,0.02);
    }

    .face-icon {
      font-size: 3.8rem;
      line-height: 1;
    }

    .face-label {
      font-size: 0.9rem;
      font-weight: bold;
      letter-spacing: 1px;
      margin-top: 4px;
      opacity: 0.7;
    }

    /* Snus nederste halvdel av symbolene på tallkort */
    .pip.rotate {
      transform: rotate(180deg);
    }

    /* Plassholdere før Flop */
    .empty-slot {
      width: 17vw;
      height: 25vw;
      max-width: 210px;
      max-height: 310px;
      border: 3px dashed rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      background-color: rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>

  <div class="board-container" id="board"></div>

  <script>
    const socket = io();
    const boardEl = document.getElementById('board');

    const SUIT_SYMBOLS = { 's': '♠', 'h': '♥', 'd': '♦', 'c': '♣' };
    const VALUE_MAP = { 'T': '10', 'J': 'J', 'Q': 'Q', 'K': 'K', 'A': 'A' };

    // Posisjons-rutenett (3 kolonner x 5 rader) for tallene 2-10
    const PIP_LAYOUTS = {
      '2': [{ col: 2, row: 1 }, { col: 2, row: 5, rot: true }],
      '3': [{ col: 2, row: 1 }, { col: 2, row: 3 }, { col: 2, row: 5, rot: true }],
      '4': [{ col: 1, row: 1 }, { col: 3, row: 1 }, { col: 1, row: 5, rot: true }, { col: 3, row: 5, rot: true }],
      '5': [{ col: 1, row: 1 }, { col: 3, row: 1 }, { col: 2, row: 3 }, { col: 1, row: 5, rot: true }, { col: 3, row: 5, rot: true }],
      '6': [{ col: 1, row: 1 }, { col: 3, row: 1 }, { col: 1, row: 3 }, { col: 3, row: 3 }, { col: 1, row: 5, rot: true }, { col: 3, row: 5, rot: true }],
      '7': [{ col: 1, row: 1 }, { col: 3, row: 1 }, { col: 2, row: 2 }, { col: 1, row: 3 }, { col: 3, row: 3 }, { col: 1, row: 5, rot: true }, { col: 3, row: 5, rot: true }],
      '8': [{ col: 1, row: 1 }, { col: 3, row: 1 }, { col: 2, row: 2 }, { col: 1, row: 3 }, { col: 3, row: 3 }, { col: 2, row: 4, rot: true }, { col: 1, row: 5, rot: true }, { col: 3, row: 5, rot: true }],
      '9': [{ col: 1, row: 1 }, { col: 3, row: 1 }, { col: 1, row: 2 }, { col: 3, row: 2 }, { col: 2, row: 3 }, { col: 1, row: 4, rot: true }, { col: 3, row: 4, rot: true }, { col: 1, row: 5, rot: true }, { col: 3, row: 5, rot: true }],
      '10': [{ col: 1, row: 1 }, { col: 3, row: 1 }, { col: 2, row: 2 }, { col: 1, row: 2 }, { col: 3, row: 2 }, { col: 1, row: 4, rot: true }, { col: 3, row: 4, rot: true }, { col: 2, row: 4, rot: true }, { col: 1, row: 5, rot: true }, { col: 3, row: 5, rot: true }]
    };

    const FACE_ICONS = {
      'J': '⚔️', // Knekt
      'Q': '👑', // Dronning
      'K': '♔'  // Konge
    };

    const FACE_NAMES = {
      'J': 'KNEKT',
      'Q': 'DRONNING',
      'K': 'KONGE'
    };

    let previousBoardCount = 0;

    socket.on('state_update', (data) => {
      const currentBoard = data.board || [];
      boardEl.innerHTML = '';
      
      if (currentBoard.length === 0) {
        previousBoardCount = 0;
        for (let i = 0; i < 5; i++) {
          const slot = document.createElement('div');
          slot.className = 'empty-slot';
          boardEl.appendChild(slot);
        }
        return;
      }

      currentBoard.forEach((cardStr, index) => {
        const valRaw = cardStr.slice(0, -1);
        const suitRaw = cardStr.slice(-1);

        const val = VALUE_MAP[valRaw] || valRaw;
        const suit = SUIT_SYMBOLS[suitRaw] || suitRaw;
        const isRed = suitRaw === 'h' || suitRaw === 'd';

        const card = document.createElement('div');
        const isNewCard = index >= previousBoardCount;
        card.className = `card ${isRed ? 'red' : 'black'} ${isNewCard ? 'card-animate' : ''}`;
        
        if (isNewCard) {
          const delay = (index - previousBoardCount) * 0.1;
          card.style.animationDelay = `${delay}s`;
        }

        // Generer midtområdet
        let centerHtml = '';
        if (val === 'A') {
          centerHtml = `<div class="card-center ace">${suit}</div>`;
        } else if (['J', 'Q', 'K'].includes(val)) {
          centerHtml = `
            <div class="card-center face-card">
              <span class="face-icon">${FACE_ICONS[val]}</span>
              <span class="face-label">${FACE_NAMES[val]}</span>
            </div>`;
        } else if (PIP_LAYOUTS[val]) {
          const pips = PIP_LAYOUTS[val].map(p => 
            `<span class="pip ${p.rot ? 'rotate' : ''}" style="grid-column: ${p.col}; grid-row: ${p.row};">${suit}</span>`
          ).join('');
          centerHtml = `<div class="card-center">${pips}</div>`;
        }

        card.innerHTML = `
          <div class="card-corner-top">
            <span class="corner-val">${val}</span>
            <span class="corner-suit">${suit}</span>
          </div>
          ${centerHtml}
          <div class="card-corner-bottom">
            <span class="corner-val">${val}</span>
            <span class="corner-suit">${suit}</span>
          </div>
        `;
        boardEl.appendChild(card);
      });

      previousBoardCount = currentBoard.length;
    });
  </script>
</body>
</html>
