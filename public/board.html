<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Løland Gård Poker - Bordkort</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b4028; /* Mørkegrønn pokerfilt */
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .board-container {
      display: flex;
      gap: 25px;
      justify-content: center;
      align-items: center;
      width: 95vw;
      max-width: 1400px;
    }

    /* Ekte kort-design i ren HTML/CSS */
    .card {
      width: 17vw;
      height: 25vw;
      max-width: 210px;
      max-height: 310px;
      background: #ffffff;
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
      border: 1px solid #ddd;
      user-select: none;
    }

    /* Farger */
    .card.red { color: #d32f2f; }
    .card.black { color: #111111; }

    /* Hjørne øverst til venstre */
    .card-corner-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: max-content;
      line-height: 0.9;
    }

    /* Hjørne nederst til høyre (snudd på hodet) */
    .card-corner-bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: max-content;
      align-self: flex-end;
      transform: rotate(180deg);
      line-height: 0.9;
    }

    .corner-val {
      font-size: 2.2rem;
      font-weight: bold;
    }

    .corner-suit {
      font-size: 2rem;
    }

    /* Stort symbol i midten */
    .card-center {
      font-size: 4.5rem;
      text-align: center;
      line-height: 1;
    }

    /* Plassholdere før kortene legges ut */
    .empty-slot {
      width: 17vw;
      height: 25vw;
      max-width: 210px;
      max-height: 310px;
      border: 3px dashed rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      background-color: rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>

  <div class="board-container" id="board"></div>

  <script>
    const socket = io();
    const boardEl = document.getElementById('board');

    const SUIT_SYMBOLS = { 's': '♠', 'h': '♥', 'd': '♦', 'c': '♣' };
    const VALUE_MAP = { 'T': '10', 'J': 'J', 'Q': 'Q', 'K': 'K', 'A': 'A' };

    socket.on('state_update', (data) => {
      boardEl.innerHTML = '';
      
      if (!data.board || data.board.length === 0) {
        for (let i = 0; i < 5; i++) {
          const slot = document.createElement('div');
          slot.className = 'empty-slot';
          boardEl.appendChild(slot);
        }
        return;
      }

      data.board.forEach(cardStr => {
        const valRaw = cardStr.slice(0, -1);
        const suitRaw = cardStr.slice(-1);

        const val = VALUE_MAP[valRaw] || valRaw;
        const suit = SUIT_SYMBOLS[suitRaw] || suitRaw;
        const isRed = suitRaw === 'h' || suitRaw === 'd';

        const card = document.createElement('div');
        card.className = `card ${isRed ? 'red' : 'black'}`;
        card.innerHTML = `
          <div class="card-corner-top">
            <span class="corner-val">${val}</span>
            <span class="corner-suit">${suit}</span>
          </div>
          <div class="card-center">${suit}</div>
          <div class="card-corner-bottom">
            <span class="corner-val">${val}</span>
            <span class="corner-suit">${suit}</span>
          </div>
        `;
        boardEl.appendChild(card);
      });
    });
  </script>
</body>
</html>
