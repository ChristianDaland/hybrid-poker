<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Løland Gård Poker - Bordvisning</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background-color: #1b4d2e;
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Zoom-kontroll øverst i hjørnet */
    .zoom-controls {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 6px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      z-index: 10;
    }

    .zoom-btn {
      background: #1e88e5;
      color: white;
      border: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      padding: 0;
    }

    .zoom-btn:hover { background: #2196f3; }

    /* Skalerbar beholder for kortene */
    .board-wrapper {
      transform-origin: center center;
      transition: transform 0.15s ease-out;
    }

    /* Fast bredde for 5 kort (5 * 140px + 4 * 20px gap = 780px) */
    .cards-container {
      display: flex;
      justify-content: flex-start;
      gap: 20px;
      width: 780px;
    }

    /* Animasjon når kun NYE kort legges ut */
    @keyframes cardFlip {
      0% {
        transform: rotateY(90deg) scale(0.8);
        opacity: 0;
      }
      100% {
        transform: rotateY(0deg) scale(1);
        opacity: 1;
      }
    }

    /* Kort-design */
    .card {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      border-radius: 12px;
      width: 140px;
      height: 195px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      font-weight: bold;
      position: relative;
      backface-visibility: hidden;
      flex-shrink: 0;
    }

    .card.animate-new {
      animation: cardFlip 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .card.red { color: #d9534f; }
    .card.black { color: #222222; }

    .card-corner {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1;
    }
    .card-corner.top-left { top: 10px; left: 10px; }
    .card-corner.bottom-right { bottom: 10px; right: 10px; transform: rotate(180deg); }

    .card-corner .val { font-size: 1.5rem; font-weight: bold; }
    .card-corner .suit { font-size: 1.2rem; margin-top: 2px; }

    .card-center-graphic {
      width: 80px;
      height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .face-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* Presis plassering av pips (symboler) */
    .pip-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .pip {
      position: absolute;
      font-size: 1.3rem;
      transform: translate(-50%, -50%);
    }

    .pip.flip {
      transform: translate(-50%, -50%) rotate(180deg);
    }
  </style>
</head>
<body>

  <!-- Zoom-kontroll -->
  <div class="zoom-controls">
    <span>Kortstørrelse:</span>
    <button class="zoom-btn" onclick="adjustZoom(-0.1)">-</button>
    <span id="zoom-val">100%</span>
    <button class="zoom-btn" onclick="adjustZoom(0.1)">+</button>
    <button class="zoom-btn" style="width: auto; padding: 0 8px; border-radius: 10px; font-size: 0.75rem;" onclick="resetZoom()">Nullstill</button>
  </div>

  <!-- Kortområde som skaleres -->
  <div id="board-wrapper" class="board-wrapper">
    <div id="board-cards" class="cards-container"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    // Zoom-håndtering
    let currentScale = parseFloat(localStorage.getItem('board_zoom')) || 1.0;

    function applyZoom() {
      document.getElementById('board-wrapper').style.transform = `scale(${currentScale})`;
      document.getElementById('zoom-val').innerText = `${Math.round(currentScale * 100)}%`;
      localStorage.setItem('board_zoom', currentScale);
    }

    function adjustZoom(delta) {
      currentScale = Math.min(Math.max(0.5, currentScale + delta), 2.5);
      applyZoom();
    }

    function resetZoom() {
      currentScale = 1.0;
      applyZoom();
    }

    applyZoom();

    // Genererer tradisjonelt posisjonerte pips for tallene 2-10 og Ess
    function renderPips(rawVal, suitSymbol) {
      if (rawVal === 'A') {
        return `<div class="pip-container"><div class="pip" style="top: 50%; left: 50%; font-size: 3rem;">${suitSymbol}</div></div>`;
      }

      const val = parseInt(rawVal === 'T' ? '10' : rawVal, 10);
      if (isNaN(val)) return '';

      const positions = [];

      if (val === 2) {
        positions.push({ x: 50, y: 15 }, { x: 50, y: 85, flip: true });
      } else if (val === 3) {
        positions.push({ x: 50, y: 15 }, { x: 50, y: 50 }, { x: 50, y: 85, flip: true });
      } else if (val === 4) {
        positions.push({ x: 25, y: 15 }, { x: 75, y: 15 }, { x: 25, y: 85, flip: true }, { x: 75, y: 85, flip: true });
      } else if (val === 5) {
        positions.push({ x: 25, y: 15 }, { x: 75, y: 15 }, { x: 50, y: 50 }, { x: 25, y: 85, flip: true }, { x: 75, y: 85, flip: true });
      } else if (val === 6) {
        positions.push({ x: 25, y: 15 }, { x: 75, y: 15 }, { x: 25, y: 50 }, { x: 75, y: 50 }, { x: 25, y: 85, flip: true }, { x: 75, y: 85, flip: true });
      } else if (val === 7) {
        positions.push({ x: 25, y: 15 }, { x: 75, y: 15 }, { x: 50, y: 32.5 }, { x: 25, y: 50 }, { x: 75, y: 50 }, { x: 25, y: 85, flip: true }, { x: 75, y: 85, flip: true });
      } else if (val === 8) {
        positions.push({ x: 25, y: 15 }, { x: 75, y: 15 }, { x: 50, y: 32.5 }, { x: 25, y: 50 }, { x: 75, y: 50 }, { x: 50, y: 67.5, flip: true }, { x: 25, y: 85, flip: true }, { x: 75, y: 85, flip: true });
      } else if (val === 9) {
        positions.push({ x: 25, y: 15 }, { x: 75, y: 15 }, { x: 25, y: 38 }, { x: 75, y: 38 }, { x: 50, y: 50 }, { x: 25, y: 62, flip: true }, { x: 75, y: 62, flip: true }, { x: 25, y: 85, flip: true }, { x: 75, y: 85, flip: true });
      } else if (val === 10) {
        positions.push({ x: 25, y: 15 }, { x: 75, y: 15 }, { x: 50, y: 27.5 }, { x: 25, y: 38 }, { x: 75, y: 38 }, { x: 25, y: 62, flip: true }, { x: 75, y: 62, flip: true }, { x: 50, y: 72.5, flip: true }, { x: 25, y: 85, flip: true }, { x: 75, y: 85, flip: true });
      }

      let html = '<div class="pip-container">';
      positions.forEach(p => {
        html += `<div class="pip ${p.flip ? 'flip' : ''}" style="top: ${p.y}%; left: ${p.x}%;">${suitSymbol}</div>`;
      });
      html += '</div>';
      return html;
    }

    function formatCard(cardCode, isNew) {
      if (!cardCode) return '';
      let rawVal = cardCode.slice(0, -1).toUpperCase();
      let displayVal = rawVal === 'T' ? '10' : rawVal;
      const suitChar = cardCode.slice(-1).toLowerCase();
      
      const suits = {
        'h': { symbol: '♥', color: 'red' },
        'd': { symbol: '♦', color: 'red' },
        'c': { symbol: '♣', color: 'black' },
        's': { symbol: '♠', color: 'black' }
      };
      
      const suit = suits[suitChar] || { symbol: suitChar, color: 'black' };

      const faceGraphics = {
        'J': '<svg class="face-img" viewBox="0 0 100 140"><rect width="100" height="140" fill="#f8f9fa" rx="8"/><path d="M30 40 L50 20 L70 40 L60 40 L60 80 L70 80 L50 100 L30 80 L40 80 L40 40 Z" fill="#4a5568"/><circle cx="50" cy="50" r="12" fill="#e53e3e"/><path d="M40 90 Q50 80 60 90" stroke="#2b6cb0" stroke-width="4" fill="none"/><text x="50" y="125" font-size="16" font-weight="bold" text-anchor="middle" fill="#2d3748">KNEKT</text></svg>',
        'Q': '<svg class="face-img" viewBox="0 0 100 140"><rect width="100" height="140" fill="#fff5f5" rx="8"/><path d="M25 50 L35 30 L50 45 L65 30 L75 50 L65 90 L35 90 Z" fill="#d69e2e"/><circle cx="35" cy="30" r="4" fill="#d69e2e"/><circle cx="50" cy="25" r="5" fill="#e53e3e"/><circle cx="65" cy="30" r="4" fill="#d69e2e"/><circle cx="50" cy="65" r="14" fill="#9b2c2c"/><text x="50" y="125" font-size="16" font-weight="bold" text-anchor="middle" fill="#742a2a">DRONNING</text></svg>',
        'K': '<svg class="face-img" viewBox="0 0 100 140"><rect width="100" height="140" fill="#f0fff4" rx="8"/><path d="M20 40 L35 25 L50 35 L65 25 L80 40 L75 95 L25 95 Z" fill="#2b6cb0"/><rect x="30" y="20" width="40" height="8" fill="#d69e2e"/><path d="M40 55 L60 55 M50 45 L50 85" stroke="#d69e2e" stroke-width="5"/><text x="50" y="125" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a365d">KONGE</text></svg>'
      };

      let centerHTML = '';
      if (faceGraphics[rawVal]) {
        centerHTML = faceGraphics[rawVal];
      } else {
        centerHTML = renderPips(rawVal, suit.symbol);
      }

      return `
        <div class="card ${suit.color} ${isNew ? 'animate-new' : ''}" data-card="${cardCode}">
          <div class="card-corner top-left">
            <span class="val">${displayVal}</span>
            <span class="suit">${suit.symbol}</span>
          </div>
          <div class="card-center-graphic">
            ${centerHTML}
          </div>
          <div class="card-corner bottom-right">
            <span class="val">${displayVal}</span>
            <span class="suit">${suit.symbol}</span>
          </div>
        </div>
      `;
    }

    let currentBoardCards = [];

    socket.on('state_update', (state) => {
      const boardContainer = document.getElementById('board-cards');
      const newBoard = state.board || [];

      if (newBoard.length === 0) {
        boardContainer.innerHTML = '';
        currentBoardCards = [];
        return;
      }

      let html = '';
      newBoard.forEach((cardCode, index) => {
        const isNew = index >= currentBoardCards.length;
        html += formatCard(cardCode, isNew);
      });

      boardContainer.innerHTML = html;
      currentBoardCards = [...newBoard];
    });
  </script>
</body>
</html>
